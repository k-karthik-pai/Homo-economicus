name: Windows desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package
        run: npm run desktop:dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: homo-economicus-windows
          path: release/**
